<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤسسة الإنسان أولاً - الإدارة</title>
    <style>
        :root { --primary: #0f172a; --accent: #2563eb; --bg: #f1f5f9; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; }
        header { background: var(--primary); color: white; padding: 20px; text-align: center; }
        .container { max-width: 900px; margin: 20px auto; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn { background: var(--accent); color: white; padding: 12px; border: none; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; }
        
        /* تنسيق جدول البيانات */
        #adminSection { display: none; margin-top: 30px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: var(--primary); color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .admin-login { border-top: 2px dashed #ccc; padding-top: 20px; text-align: center; }
    </style>
</head>
<body>

<header>
    <h1>مؤسسة الإنسان أولاً</h1>
    <p>نظام التسجيل السحابي المباشر</p>
</header>

<div class="container">
    <div class="card" id="formCard">
        <h3>📝 تسجيل طلب مساعدة جديد</h3>
        <form id="regForm">
            <input type="text" id="name" placeholder="الاسم الرباعي" required>
            <input type="number" id="idCard" placeholder="رقم الهوية" required>
            <input type="number" id="phone" placeholder="رقم الجوال" required>
            <select id="gov">
                <option>شمال غزة</option><option>غزة</option><option>الوسطى</option><option>خانيونس</option><option>رفح</option>
            </select>
            <input type="number" id="famCount" placeholder="عدد الأفراد" required>
            <button type="submit" id="submitBtn" class="btn">إرسال الطلب ✅</button>
        </form>
    </div>

    <div class="admin-login">
        <button onclick="showLogin()" style="background:none; border:none; color:#64748b; cursor:pointer;">دخول الإدارة (للمسؤول فقط) 🔐</button>
        <div id="loginBox" style="display:none; margin-top:10px;">
            <input type="password" id="adminPass" placeholder="أدخل كلمة المرور" style="width:200px;">
            <button onclick="checkPass()" class="btn" style="width:100px;">دخول</button>
        </div>
    </div>

    <div id="adminSection" class="card">
        <h3>📊 كشوفات المسجلين (من قاعدة البيانات)</h3>
        <table id="requestsTable">
            <thead>
                <tr>
                    <th>الاسم</th><th>الهوية</th><th>الجوال</th><th>المنطقة</th><th>التاريخ</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // إعدادات Firebase الخاصة بك
    const firebaseConfig = {
        apiKey: "AIzaSyC8PzIvcQ5oV-D3GO1Y3bJ1sWVOhMHTS64",
        authDomain: "myproject-9e7e8.firebaseapp.com",
        databaseURL: "https://myproject-9e7e8-default-rtdb.firebaseio.com",
        projectId: "myproject-9e7e8",
        storageBucket: "myproject-9e7e8.firebasestorage.app",
        messagingSenderId: "303472996551",
        appId: "1:303472996551:web:e009b6824b2a0b44870ee2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 1. وظيفة الإرسال
    document.getElementById('regForm').onsubmit = function(e) {
        e.preventDefault();
        const userId = document.getElementById('idCard').value;
        const data = {
            name: document.getElementById('name').value,
            idCard: userId,
            phone: document.getElementById('phone').value,
            gov: document.getElementById('gov').value,
            time: new Date().toLocaleString('ar-EG')
        };
        set(ref(db, 'requests/' + userId), data).then(() => {
            alert("تم الحفظ!");
            location.reload();
        });
    };

    // 2. وظيفة جلب البيانات وعرضها في الجدول
    window.fetchData = function() {
        const tableBody = document.getElementById('tableBody');
        onValue(ref(db, 'requests'), (snapshot) => {
            tableBody.innerHTML = ""; // مسح الجدول القديم
            snapshot.forEach((childSnapshot) => {
                const item = childSnapshot.val();
                tableBody.innerHTML += `
                    <tr>
                        <td>${item.name}</td>
                        <td>${item.idCard}</td>
                        <td>${item.phone}</td>
                        <td>${item.gov}</td>
                        <td>${item.time}</td>
                    </tr>
                `;
            });
        });
    };

    // وظائف التحكم في العرض
    window.showLogin = () => document.getElementById('loginBox').style.display='block';
    window.checkPass = () => {
        if(document.getElementById('adminPass').value === "123") { // كلمة المرور هنا 123
            document.getElementById('adminSection').style.display='block';
            document.getElementById('formCard').style.display='none';
            fetchData(); // جلب البيانات عند الدخول
        } else {
            alert("كلمة مرور خاطئة!");
        }
    };
</script>
</body>
</html>
