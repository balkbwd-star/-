<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة الإغاثة الشاملة | مؤسسة الإنسان أولاً</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main: #0f172a; --blue: #2563eb; --green: #10b981; --red: #ef4444; --gray: #f8fafc; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--gray); margin: 0; color: #1e293b; }
        nav { background: var(--main); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .hero { background: linear-gradient(135deg, var(--main), var(--blue)); color: white; padding: 50px 20px; text-align: center; clip-path: polygon(0 0, 100% 0, 100% 90%, 0 100%); }
        .container { max-width: 1100px; margin: -40px auto 50px; padding: 0 20px; }
        .card { background: white; border-radius: 20px; padding: 35px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); border: 1px solid #e2e8f0; }
        .page { display: none; animation: fadeIn 0.4s ease; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-weight: 600; font-size: 13px; color: var(--main); }
        input, select, textarea { padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; }
        
        .btn { padding: 14px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 10px; justify-content: center; }
        .btn-blue { background: var(--blue); color: white; width: 100%; font-size: 17px; }
        
        .stats-bar { display: flex; justify-content: space-between; align-items: center; background: var(--main); color: white; padding: 15px 25px; border-radius: 15px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 1400px; }
        th { background: #f1f5f9; padding: 12px; font-size: 12px; color: var(--main); }
        td { padding: 10px; border-bottom: 1px solid #f1f5f9; font-size: 13px; text-align: center; }
        .loading-text { text-align: center; padding: 20px; color: var(--blue); font-weight: bold; }
    </style>
</head>
<body>

<nav>
    <div class="logo" onclick="location.reload()" style="cursor:pointer"><i class="fas fa-hand-holding-heart"></i> مؤسسة الإنسان أولاً</div>
    <button onclick="showPage('loginPage')" class="btn" style="background:rgba(255,255,255,0.1); color:white; font-size:12px;">لوحة المطور</button>
</nav>

<div id="heroSection" class="hero">
    <h2>نحن معكم وبكم.. سجل بياناتك الآن</h2>
    <p>لضمان وصول المساعدات لمستحقيها بكل أمانة وشفافية في قطاع غزة.</p>
</div>

<div class="container">
    
    <div id="registerPage" class="page active card">
        <h3 style="margin-top:0"><i class="fas fa-edit"></i> نموذج تسجيل مستفيد شامل</h3>
        <form id="fullForm">
            <div class="grid-inputs">
                <div class="input-group"><label>الاسم الرباعي</label><input type="text" id="name" required></div>
                <div class="input-group"><label>رقم الهوية</label><input type="number" id="idCard" required></div>
                <div class="input-group"><label>رقم الجوال الأساسي</label><input type="number" id="phone1" required></div>
                <div class="input-group"><label>رقم جوال بديل</label><input type="number" id="phone2"></div>
                
                <div class="input-group"><label>المحافظة</label>
                    <select id="gov">
                        <option>شمال غزة</option><option>غزة</option><option>الوسطى</option><option>خانيونس</option><option>رفح</option>
                    </select>
                </div>
                <div class="input-group"><label>مكان النزوح الحالي</label><input type="text" id="currentLoc" placeholder="اسم المدرسة أو المخيم" required></div>
                
                <div class="input-group"><label>عدد أفراد الأسرة</label><input type="number" id="famCount" required></div>
                <div class="input-group"><label>الحالة الاجتماعية</label>
                    <select id="socialStatus">
                        <option>معيل (أب)</option><option>أرملة</option><option>مطلقة</option><option>أعزب</option>
                    </select>
                </div>

                <div class="input-group"><label>ذوي احتياجات خاصة؟</label>
                    <select id="disability">
                        <option>لا يوجد</option><option>نعم - إعاقة حركية</option><option>نعم - مرض مزمن</option>
                    </select>
                </div>
                <div class="input-group"><label>نوع السكن الحالي</label>
                    <select id="houseType">
                        <option>خيمة</option><option>مركز إيواء</option><option>منزل مستأجر</option><option>عند أقارب</option>
                    </select>
                </div>

                <div class="input-group"><label>نوع المساعدة المطلوبة</label>
                    <select id="aidType">
                        <option>طرد غذائي</option><option>مساعدة نقدية</option><option>خيمة</option><option>منظفات</option>
                    </select>
                </div>
                <div class="input-group"><label>الدخل الشهري الحالي</label><input type="text" id="income" placeholder="مثلاً: لا يوجد"></div>
            </div>
            
            <div class="input-group"><label>العنوان التفصيلي وملاحظات إضافية</label><textarea id="address" rows="3" required></textarea></div>
            
            <button type="submit" class="btn btn-blue" id="sendBtn" style="margin-top:20px;">إرسال الطلب وحفظ البيانات ✅</button>
        </form>
    </div>

    <div id="successPage" class="page card" style="text-align:center;">
        <i class="fas fa-check-circle" style="font-size:70px; color:var(--green);"></i>
        <h2>تم حفظ بياناتك بنجاح</h2>
        <p>تم استلام طلبك في نظامنا السحابي بنجاح.</p>
        <button onclick="location.reload()" class="btn btn-blue" style="width:auto; margin-top:20px;">العودة للرئيسية</button>
    </div>

    <div id="loginPage" class="page card" style="max-width:400px; margin: 0 auto; text-align:center;">
        <h3>دخول المطورين</h3>
        <input type="password" id="adminPass" placeholder="كلمة المرور" style="text-align:center; margin-bottom:15px; width: 100%;">
        <button id="loginBtn" class="btn btn-blue">دخول</button>
    </div>

    <div id="adminPage" class="page card">
        <div class="stats-bar">
            <div><i class="fas fa-database"></i> المسجلين: <span id="userCount">0</span></div>
            <button id="exportBtn" class="btn" style="background:var(--green); color:white; width:auto;">تصدير Excel</button>
        </div>
        <input type="text" id="searchInp" placeholder="🔍 ابحث بالاسم أو الهوية..." style="margin-bottom:15px; width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd;">
        <div style="overflow-x:auto;">
            <table id="mainTable">
                <thead>
                    <tr>
                        <th>الاسم</th><th>الهوية</th><th>الجوال</th><th>المنطقة</th><th>النزوح</th><th>أفراد</th><th>الحالة</th><th>إعاقة</th><th>سكن</th><th>مساعدة</th><th>التاريخ</th><th>حذف</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // بيانات الاتصال المحدثة بناءً على طلبك الأخير
    const firebaseConfig = {
        apiKey: "AIzaSyC8PzIvcQ5oV-D3GO1Y3bJ1sWVOhMHTS64",
        authDomain: "myproject-9e7e8.firebaseapp.com",
        databaseURL: "https://myproject-9e7e8-default-rtdb.firebaseio.com",
        projectId: "myproject-9e7e8",
        storageBucket: "myproject-9e7e8.firebasestorage.app",
        messagingSenderId: "303472996551",
        appId: "1:303472996551:web:86012a6125028c240b4487" // تم التحديث ليتوافق مع النسخة الجديدة
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // التنقل بين الصفحات
    window.showPage = (id) => {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('heroSection').style.display = (id === 'registerPage') ? 'block' : 'none';
    };

    // إرسال البيانات
    document.getElementById('fullForm').onsubmit = (e) => {
        e.preventDefault();
        const btn = document.getElementById('sendBtn');
        btn.disabled = true;
        btn.innerText = "جاري الحفظ...";

        const id = document.getElementById('idCard').value;
        const data = {
            name: document.getElementById('name').value, idCard: id,
            p1: document.getElementById('phone1').value, p2: document.getElementById('phone2').value,
            gov: document.getElementById('gov').value, loc: document.getElementById('currentLoc').value,
            fam: document.getElementById('famCount').value, social: document.getElementById('socialStatus').value,
            dis: document.getElementById('disability').value, house: document.getElementById('houseType').value,
            aid: document.getElementById('aidType').value, inc: document.getElementById('income').value,
            addr: document.getElementById('address').value, time: new Date().toLocaleString('ar-EG')
        };

        set(ref(db, 'requests/' + id), data)
            .then(() => showPage('successPage'))
            .catch(err => { alert("خطأ: " + err.message); btn.disabled = false; });
    };

    // تسجيل الدخول للمطور
    document.getElementById('loginBtn').onclick = () => {
        if(document.getElementById('adminPass').value === "20052005") {
            showPage('adminPage');
            syncData();
        } else { alert("كلمة المرور خاطئة!"); }
    };

    // مزامنة البيانات من Firebase
    function syncData() {
        const body = document.getElementById('tableBody');
        body.innerHTML = "<tr><td colspan='12' class="loading-text">جاري تحميل البيانات من السحابة...</td></tr>";

        onValue(ref(db, 'requests'), (snap) => {
            body.innerHTML = "";
            let count = 0;
            if(!snap.exists()) {
                body.innerHTML = "<tr><td colspan='12'>لا توجد بيانات مسجلة حالياً</td></tr>";
                return;
            }
            snap.forEach((child) => {
                const v = child.val();
                count++;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${v.name}</td><td>${v.idCard}</td><td>${v.p1}</td><td>${v.gov}</td>
                    <td>${v.loc}</td><td>${v.fam}</td><td>${v.social}</td><td>${v.dis}</td>
                    <td>${v.house}</td><td>${v.aid}</td><td style="font-size:10px">${v.time}</td>
                    <td><button onclick="window.delItem('${v.idCard}')" style="color:var(--red); background:none; border:none; cursor:pointer;"><i class="fas fa-trash"></i></button></td>
                `;
                body.appendChild(tr);
            });
            document.getElementById('userCount').innerText = count;
        });
    }

    // وظيفة البحث
    document.getElementById('searchInp').onkeyup = function() {
        let val = this.value.toLowerCase();
        let rows = document.querySelectorAll('#tableBody tr');
        rows.forEach(r => {
            r.style.display = r.innerText.toLowerCase().includes(val) ? "" : "none";
        });
    };

    // وظيفة الحذف
    window.delItem = (id) => {
        if(confirm("هل أنت متأكد من حذف هذا السجل؟")) {
            remove(ref(db, 'requests/' + id)).then(() => alert("تم الحذف بنجاح"));
        }
    };

    // تصدير إكسل
    document.getElementById('exportBtn').onclick = () => {
        const wb = XLSX.utils.table_to_book(document.getElementById('mainTable'));
        XLSX.writeFile(wb, "كشف_مستفيدي_مؤسسة_الإنسان_أولاً.xlsx");
    };
</script>
</body>
</html>
